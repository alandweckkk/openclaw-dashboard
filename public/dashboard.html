<!DOCTYPE html>
<html>
<head>
    <title>OpenClaw Dashboard - Direct Access</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }
        #app {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #1e293b;
            border-right: 1px solid #334155;
            padding: 1rem;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1e293b;
            padding: 1rem;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        .input-area {
            display: flex;
            gap: 0.5rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 0.375rem;
            color: #e2e8f0;
            font-size: 1rem;
        }
        button {
            padding: 0.75rem 1.5rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        .status {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status.connected { background: #10b981; color: white; }
        .status.disconnected { background: #ef4444; color: white; }
        .status.connecting { background: #f59e0b; color: white; }
        .message {
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            background: #334155;
        }
        .message.user { background: #1e40af; }
        .message.assistant { background: #059669; }
        .logo { font-size: 1.5rem; }
        .nav-item {
            padding: 0.5rem;
            margin: 0.25rem 0;
            border-radius: 0.25rem;
            cursor: pointer;
            color: #94a3b8;
        }
        .nav-item:hover { background: #334155; }
        .nav-item.active { background: #3b82f6; color: white; }
    </style>
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <h1 class="logo">🦞 OpenClaw</h1>
            <div style="margin: 2rem 0;">
                <div class="nav-item active">💬 Chat</div>
                <div class="nav-item">⚙️ Config</div>
                <div class="nav-item">📊 Sessions</div>
                <div class="nav-item">🔧 Skills</div>
                <div class="nav-item">📝 Logs</div>
            </div>
        </div>
        <div class="main">
            <div class="header">
                <span class="status" id="status">Connecting...</span>
                <span id="info">Connecting to OpenClaw Gateway...</span>
            </div>
            <div class="chat-container">
                <div class="messages" id="messages">
                    <div class="message assistant">
                        <strong>Sam:</strong> Hey! I'm connecting to the OpenClaw Gateway... This bypasses all the authentication bullshit.
                    </div>
                </div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Type your message..." disabled>
                    <button id="sendButton" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GATEWAY_URL = 'wss://fe58-2601-646-100-38d0-40db-4e0d-e01-c714.ngrok-free.app';
        const AUTH_TOKEN = 'cc90f313556bb0d6ff68d00184b2405000dc055ea4eec81a';
        
        let ws = null;
        let sessionId = null;
        
        const status = document.getElementById('status');
        const info = document.getElementById('info');
        const messages = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        
        function updateStatus(state, text) {
            status.className = `status ${state}`;
            status.textContent = state.charAt(0).toUpperCase() + state.slice(1);
            info.textContent = text;
        }
        
        function addMessage(sender, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<strong>${sender === 'user' ? 'You' : 'Sam'}:</strong> ${content}`;
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function connect() {
            updateStatus('connecting', 'Connecting to OpenClaw Gateway...');
            
            ws = new WebSocket(GATEWAY_URL);
            
            ws.onopen = function() {
                updateStatus('connected', 'Connected to OpenClaw Gateway');
                
                // Send authentication
                ws.send(JSON.stringify({
                    type: 'auth',
                    token: AUTH_TOKEN
                }));
                
                // Start a new session
                ws.send(JSON.stringify({
                    type: 'start_session',
                    agent: 'main'
                }));
                
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'message' && data.content) {
                        addMessage('assistant', data.content);
                    } else if (data.type === 'session_started') {
                        sessionId = data.sessionId;
                        addMessage('assistant', 'Hey! Direct connection established. No more authentication bullshit. What can I help you with?');
                    }
                } catch (e) {
                    console.log('Raw message:', event.data);
                }
            };
            
            ws.onclose = function() {
                updateStatus('disconnected', 'Disconnected from gateway');
                messageInput.disabled = true;
                sendButton.disabled = true;
                
                // Try to reconnect after 3 seconds
                setTimeout(connect, 3000);
            };
            
            ws.onerror = function(error) {
                updateStatus('disconnected', 'Connection error');
                console.error('WebSocket error:', error);
            };
        }
        
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && ws && ws.readyState === WebSocket.OPEN) {
                addMessage('user', message);
                
                ws.send(JSON.stringify({
                    type: 'message',
                    content: message,
                    sessionId: sessionId
                }));
                
                messageInput.value = '';
            }
        }
        
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        sendButton.addEventListener('click', sendMessage);
        
        // Start connection
        connect();
    </script>
</body>
</html>
